{% extends 'crm/base.html' %}
{% block title %}{% if customer %}编辑客户{% else %}新增客户{% endif %} - 试剂耗材ERP{% endblock %}

{% block content %}
<div style="max-width:760px; margin:0 auto;">
    <div style="margin-bottom:16px;">
        <a href="{% url 'customer_list' %}" style="color:#666; text-decoration:none;">
            ← 返回客户列表
        </a>
    </div>

    <div class="card">
        <div class="card-title">
            {% if customer %}✏️ 编辑客户：{{ customer.name }}{% else %}👤 新增客户{% endif %}
        </div>

        <form method="post">
            {% csrf_token %}

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">

                <div class="form-group">
                    <label>姓名 <span style="color:red;">*</span></label>
                    <input type="text" name="name" class="form-control" required
                           placeholder="例：张老师"
                           value="{{ customer.name|default:'' }}">
                </div>

                <div class="form-group">
                    <label>单位</label>
                    <input type="text" name="institution" class="form-control"
                           placeholder="例：北京大学"
                           value="{{ customer.institution|default:'' }}">
                </div>

                <div class="form-group">
                    <label>课题组</label>
                    <input type="text" name="lab_group" class="form-control"
                           placeholder="例：张三课题组"
                           value="{{ customer.lab_group|default:'' }}">
                </div>

                <div class="form-group">
                    <label>研究方向</label>
                    <input type="text" name="research_direction" class="form-control"
                           placeholder="例：细胞凋亡、蛋白质组学"
                           value="{{ customer.research_direction|default:'' }}">
                </div>

                <div class="form-group">
                    <label>电话 / 微信</label>
                    <input type="text" name="phone" class="form-control"
                           placeholder="例：138xxxx8888"
                           value="{{ customer.phone|default:'' }}">
                </div>

                <div class="form-group">
                    <label>邮箱</label>
                    <input type="email" name="email" class="form-control"
                           placeholder="例：zhang@pku.edu.cn"
                           value="{{ customer.email|default:'' }}">
                </div>

                <div class="form-group">
                    <label>生日
                        <span style="color:#999; font-size:12px;">（用于生日提醒，只需填月日也可填年月日）</span>
                    </label>
                    <input type="date" name="birthday" class="form-control"
                           value="{{ customer.birthday|date:'Y-m-d'|default:'' }}">
                </div>

                <div class="form-group">
                    <label>客户状态</label>
                    <select name="status" class="form-control">
                        <option value="potential" {% if customer.status == 'potential' or not customer %}selected{% endif %}>潜在客户</option>
                        <option value="active" {% if customer.status == 'active' %}selected{% endif %}>活跃客户</option>
                        <option value="inactive" {% if customer.status == 'inactive' %}selected{% endif %}>沉睡客户</option>
                        <option value="lost" {% if customer.status == 'lost' %}selected{% endif %}>流失客户</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>客户来源</label>
                    <select name="source" class="form-control">
                        <option value="wechat" {% if customer.source == 'wechat' %}selected{% endif %}>微信介绍</option>
                        <option value="xiaohongshu" {% if customer.source == 'xiaohongshu' %}selected{% endif %}>小红书</option>
                        <option value="xianyu" {% if customer.source == 'xianyu' %}selected{% endif %}>咸鱼</option>
                        <option value="taobao" {% if customer.source == 'taobao' %}selected{% endif %}>淘宝</option>
                        <option value="dealer" {% if customer.source == 'dealer' %}selected{% endif %}>经销商介绍</option>
                        <option value="other" {% if customer.source == 'other' %}selected{% endif %}>其他</option>
                    </select>
                </div>

            </div>

            <div class="form-group">
                <label>备注</label>
                <textarea name="notes" class="form-control" rows="4"
                          placeholder="其他需要记录的信息，如常用品牌偏好、预算范围等...">{{ customer.notes|default:'' }}</textarea>
            </div>

            <div style="display:flex; gap:10px;">
                <button type="submit" class="btn btn-success">
                    ✅ {% if customer %}保存修改{% else %}添加客户{% endif %}
                </button>
                <a href="{% url 'customer_list' %}" class="btn btn-secondary">取消</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
